<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Tarea</title>
</head>

<body
    class="flex items-center justify-center font-[K2D] bg-gradient-to-r from-[#80AAA2] from-40% to-[#4A90E2] to-80% h-dvh w-auto">
    <article class="grid grid-cols-2 bg-[#D9D9D9] w-[1320px] h-[600px] rounded-3xl shadow-xl border-slate-950">
        <div class="flex flex-col items-center ">
            <h1 class="text-center text-5xl font-extrabold mt-28">Iniciar Sesión</h1>
            <div class="flex flex-col mt-14 w-96 my-3">
                <label class="text-lg mb-1" for="">Correo electrónico</label>
                <input class="bg-[#80A3AA] placeholder-[#333333] h-9" type="mail" placeholder="ejemplo@correo.com">
            </div>
            <div class="flex flex-col w-96 my-3">
                <label class="text-lg mb-1" for="">Contraseña</label>
                <input class="bg-[#80A3AA]  placeholder-[#333333] h-9" type="password" placeholder="*******">
            </div>
            <button class="mt-10 text-white bg-[#4A90E2] border-black rounded-2xl px-16 py-2">Enviar</button>
        </div>
        <div class=" bg-[#80A3AA] w-[660px] h-[600px] rounded-3xl rounded-bl-[40px] rounded-tl-[40px]">
            <img src="assets/img/imagen.png" alt="" srcset="" class="mt-24">
        </div>
    </article>
</body>

</html>
